# Varroa Mite Detector Configuration

# Model Settings
model:
  name: "yolov8n"           # Base model: n=nano, s=small, m=medium, l=large
  weights: "models/varroa_best.pt"  # Trained weights path
  confidence: 0.25          # Detection confidence threshold
  iou: 0.45                 # NMS IoU threshold

# Training Settings
training:
  epochs: 100
  batch_size: 16
  image_size: 640           # Input image size
  patience: 20              # Early stopping patience
  workers: 4                # Data loader workers
  device: ""                # "" = auto, "cpu", "0" = GPU 0

# Data Paths
data:
  raw: "data/raw"
  annotated: "data/annotated"
  train: "data/train"
  val: "data/val"
  test: "data/test"

# Classes
classes:
  - varroa_mite

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  max_upload_size: 10485760  # 10MB

# Preprocessing
preprocessing:
  resize: true
  target_size: [640, 640]
  normalize: true
