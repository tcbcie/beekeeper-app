<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCBC Research Widget — Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 980px; margin: 40px auto; padding: 0 20px; background: #f3f4f6; color: #111827; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p.note { color: #6b7280; font-size: 14px; }
    .section { margin-top: 40px; }
    .section h2 { font-size: 16px; color: #374151; }
  </style>
</head>
<body>
  <h1>TCBC Research Widget — Preview</h1>
  <p class="note">Two copies of the widget embedded below — light and dark themes. In production, TCBC embeds one via the WordPress shortcode.</p>

  <div class="section">
    <h2>Light theme (default)</h2>
    <div id="tcbc-gdd-widget-light"></div>
  </div>

  <div class="section">
    <h2>Dark theme (forced)</h2>
    <div id="tcbc-gdd-widget-dark"></div>
  </div>

  <!-- Light -->
  <script src="./tcbc-research-widget.js"
          data-target="#tcbc-gdd-widget-light"
          data-region="galway"
          data-theme="light"></script>

  <!-- Dark -->
  <script src="./tcbc-research-widget.js"
          data-target="#tcbc-gdd-widget-dark"
          data-region="galway"
          data-theme="dark"></script>
</body>
</html>
